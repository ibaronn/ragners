name: Build iOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
  PROJECT_NAME: AIPhotoEnhancerPro
  SCHEME: AIPhotoEnhancerPro

jobs:
  build:
    name: Build, Test & Package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            DerivedData
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath .build

      - name: Show build settings
        run: |
          xcodebuild -showBuildSettings \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" 2>&1 | head -50

      - name: Build for Simulator & Run Unit Tests
        run: |
          xcodebuild test \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.0" \
            -derivedDataPath DerivedData \
            -only-testing:UnitTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for Device (Packaging)
        run: |
          xcodebuild build \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate .app
        id: find_app
        run: |
          APP_PATH=$(find DerivedData/Build/Products -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Package .app as ZIP
        run: |
          APP_PATH="${{ steps.find_app.outputs.APP_PATH }}"
          if [ -d "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "${{ runner.temp }}/$PROJECT_NAME.zip" "$(basename "$APP_PATH")"
            echo "✅ App packaged: ${{ runner.temp }}/$PROJECT_NAME.zip"
          else
            echo "⚠️ .app not found at expected path, searching..."
            find DerivedData -name "*.app" -type d
          fi

      - name: Upload App (.app.zip)
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photo-Enhancer-Pro
          path: ${{ runner.temp }}/${{ env.PROJECT_NAME }}.zip
          retention-days: 30

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: DerivedData/Logs
          retention-days: 7

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: AI Photo Enhancer Pro v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## Build ${{ github.run_number }}

            ### التحميل
            - اذهب إلى أسفل الصفحة
            - في قسم **Artifacts**، اضغط على **AI-Photo-Enhancer-Pro**
            - فك الضغط، ثم استخدم AltStore أو SideStore لتثبيت الـ .app

            ### ملاحظة
            هذا build بدون توقيع (unsigned). يحتاج sideload عبر AltStore أو SideStore.
          files: |
            ${{ runner.temp }}/${{ env.PROJECT_NAME }}.zip
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
