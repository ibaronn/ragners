name: Build iOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
  PROJECT_NAME: AIPhotoEnhancerPro
  SCHEME: AIPhotoEnhancerPro

jobs:
  build:
    name: Build, Test & Package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath .build

      - name: Build & Test (Simulator)
        run: |
          xcodebuild test \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.0" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | xcpretty && echo "✅ Tests passed"

      - name: Build for Device
        run: |
          xcodebuild build \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData-Device \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        run: |
          DD="DerivedData-Device"
          echo "=== find .app ==="
          find "$DD" -name "*.app" 2>/dev/null
          echo "=== find any .app under Products ==="
          find "$DD/Build" -name "*.app" 2>/dev/null
          echo "=== Directory structure ==="
          ls -R "$DD/Build/" 2>/dev/null | head -30

          APP_PATH=$(find "$DD" -name "*.app" -type d 2>/dev/null | head -1)
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ No .app found"
            echo "=== Trying build settings ==="
            xcodebuild -showBuildSettings -project "$PROJECT_NAME.xcodeproj" -scheme "$SCHEME" -configuration Debug -destination "generic/platform=iOS" 2>/dev/null | grep -i "BUILT_PRODUCTS_DIR\|TARGET_BUILD_DIR\|EXECUTABLE_PATH" | head -5 || echo "No build settings"
            exit 1
          fi
          echo "✅ App: $APP_PATH ($(du -sh "$APP_PATH" | cut -f1))"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r "$PROJECT_NAME.ipa" Payload/
          echo "✅ IPA: $(du -sh "$PROJECT_NAME.ipa" | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photo-Enhancer-Pro
          path: ${{ runner.temp }}/${{ env.PROJECT_NAME }}.ipa
          retention-days: 30

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: DerivedData/Logs
          retention-days: 7
