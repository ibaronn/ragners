name: Build iOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
  PROJECT_NAME: AIPhotoEnhancerPro
  SCHEME: AIPhotoEnhancerPro

jobs:
  build:
    name: Build, Test & Package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath .build

      - name: Build & Test (Simulator)
        run: |
          xcodebuild test \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.0" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | xcpretty && echo "✅ Tests passed"

      - name: Build for Device
        continue-on-error: true
        run: |
          rm -rf DerivedData
          xcodebuild build \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Locate & Package .app
        if: ${{ always() }}
        run: |
          APP_PATH=$(find DerivedData/Build/Products -name "*.app" -type d | head -1)
          if [ -d "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            cd "$(dirname "$APP_PATH")"
            zip -r "$RUNNER_TEMP/$PROJECT_NAME.zip" "$(basename "$APP_PATH")"
            echo "✅ App packaged: $RUNNER_TEMP/$PROJECT_NAME.zip"
          else
            echo "⚠️ No .app found. Searching..."
            find DerivedData -name "*.app" -type d 2>/dev/null || echo "No .app at all"
          fi

      - name: Upload App
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photo-Enhancer-Pro
          path: ${{ runner.temp }}/${{ env.PROJECT_NAME }}.zip
          retention-days: 30

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: DerivedData/Logs
          retention-days: 7
