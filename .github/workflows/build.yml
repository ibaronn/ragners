name: Build iOS App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
  PROJECT_NAME: AIPhotoEnhancerPro
  SCHEME: AIPhotoEnhancerPro

jobs:
  build:
    name: Build, Test & Package
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath .build

      - name: Build & Test (Simulator)
        run: |
          xcodebuild test \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=18.0" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO | xcpretty && echo "✅ Tests passed"

      - name: Archive for Device
        run: |
          rm -rf DerivedData
          xcodebuild archive \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -archivePath "$RUNNER_TEMP/$PROJECT_NAME.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        run: |
          # IPA = Zip with Payload/App.app inside
          APP_PATH=$(find "$RUNNER_TEMP/$PROJECT_NAME.xcarchive" -name "*.app" -type d)
          echo "App found: $APP_PATH"
          ls -la "$APP_PATH" | head -5

          # Create IPA structure
          PAYLOAD_DIR="$RUNNER_TEMP/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          # Create IPA (zip → rename to .ipa)
          cd "$RUNNER_TEMP"
          zip -r "$PROJECT_NAME.ipa" Payload/
          echo "✅ IPA size: $(wc -c < "$PROJECT_NAME.ipa") bytes"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Photo-Enhancer-Pro
          path: ${{ runner.temp }}/${{ env.PROJECT_NAME }}.ipa
          retention-days: 30

      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: DerivedData/Logs
          retention-days: 7
